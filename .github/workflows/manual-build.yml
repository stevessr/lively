name: Manual Build Multi-Platform

on:
  workflow_dispatch # 允许手动触发 workflow

jobs:
  build:
    runs-on: ${{ matrix.os }} # 在矩阵中指定的操作系统环境中运行

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        arch: [x64, arm64]
        include:
          # Windows builds
          - os: windows-latest
            arch: x86
            rid: win-x86
          - os: windows-latest
            arch: x64
            rid: win-x64
          - os: windows-latest
            arch: arm64
            rid: win-arm64
          # Linux builds
          - os: ubuntu-latest
            arch: x64
            rid: linux-x64
          - os: ubuntu-latest
            arch: arm64
            rid: linux-arm64
          # macOS builds
          - os: macos-latest
            arch: x64
            rid: osx-x64
          - os: macos-latest
            arch: arm64
            rid: osx-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # 检出代码

    - name: Setup .NET
      uses: actions/setup-dotnet@v4 # 安装 .NET SDK
      with:
        dotnet-version: '9.x' # 使用 .NET 9 版本

    - name: Restore dependencies
      run: dotnet restore src/Lively/Lively.sln # 恢复项目依赖

    - name: Clean solution ${{ matrix.rid }}
      run: dotnet clean src/Lively/Lively.sln --configuration Release -r ${{ matrix.rid }} # 清理指定 RID 的解决方案

    - name: Build solution ${{ matrix.rid }}
      run: dotnet build src/Lively/Lively.sln --no-restore --configuration Release -r ${{ matrix.rid }} # 构建指定 RID 的解决方案

    - name: Upload build artifacts ${{ matrix.rid }}
      uses: actions/upload-artifact@v4 # 上传编译结果
      with:
        name: lively-build-outputs-${{ matrix.rid }} # Artifact 名称包含 RID
        path: src/Lively/*/bin/Release/**/${{ matrix.rid }}/ # 编译结果路径 for each project and RID